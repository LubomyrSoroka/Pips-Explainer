<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pips Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <input type="date" id="puzzle-date"></input>
    <select id="puzzle-difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>
    <button id="get-puzzle">Get puzzle</button>

    <div id="reasoning-text"></div>
    <div id="sub-reasoning-text"></div>
    <div id="board"></div>
    <div id="dominoes"></div>
    <div id="controls">
        <!-- <button id="next">Next</button>
        <button style="display: none;" id="next-for-wrong-path">Next for wrong path</button> -->
    </div>
    <div id="part-counts"> </div>
    <div id="sums"></div>
    <script type='module' src="getPuzzle.js"></script>
</body>

</html>
