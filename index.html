<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pips Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <div style="display: flex; gap: 5px;">
            <input type="date" id="puzzle-date"></input>
            <select id="puzzle-difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="get-puzzle">Get puzzle</button>
        </div>
        <div id="reasoning-text"></div>
        <div id="sub-reasoning-text"></div>
        <div id="board"></div>
        <div id="dominoes"></div>
        <div id="controls"> </div>
    </div>

    <!-- <div id="part-counts"> </div>
    <div id="sums"></div> -->
    <script type='module' src="getPuzzle.js"></script>
</body>

</html>
